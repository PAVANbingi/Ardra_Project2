<div class="card shadow-sm border-0 mb-3 rounded-3">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title mb-0">{{ ticket.title }}</h5>
      <span
        class="badge px-3 py-2"
        [ngClass]="{
          'bg-success': ticket.status === 'Closed',
          'bg-warning text-dark': ticket.status === 'In Progress',
          'bg-danger': ticket.status === 'Open'
        }"
      >
        {{ ticket.status }}
      </span>
    </div>

    <p class="text-muted small mb-1">
      <i class="bi bi-hash me-1"></i>Ticket ID: <strong>#{{ ticket.id }}</strong>
    </p>

    <p class="small mb-2">
      <i class="bi bi-flag me-1"></i>Priority:
      <span
        class="badge"
        [ngClass]="{
          'bg-danger': ticket.priority === 'High',
          'bg-warning text-dark': ticket.priority === 'Medium',
          'bg-secondary': ticket.priority === 'Low'
        }"
      >
        {{ ticket.priority }}
      </span>
    </p>

    <button class="btn btn-sm btn-outline-primary rounded-pill" (click)="toggleDetails()">
      <i class="bi" [ngClass]="showDetails ? 'bi-eye-slash' : 'bi-eye'"></i>
      {{ showDetails ? 'Hide Details' : 'Show Details' }}
    </button>

    <div *ngIf="showDetails" class="mt-3">
      <p class="text-body small">{{ ticket.description }}</p>
    </div>
  </div>
</div>
